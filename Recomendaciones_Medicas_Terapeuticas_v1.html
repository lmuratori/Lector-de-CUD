<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0b1f3a;--blue:#2563eb;--green:#16a34a;--amber:#d97706;
  --red:#dc2626;--purple:#7c3aed;--teal:#0891b2;
  --border:#e2e8f0;--muted:#64748b;--bg:#f0f4f8;--surface:#fff;
  --radius:10px;--shadow:0 2px 8px rgba(0,0,0,.08);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:#111;font-size:13px}
.header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.hdr-logo{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.hdr-logo img{width:100%;height:100%;object-fit:cover}
.hdr-info{flex:1}
.hdr-dr{font-family:'Playfair Display',serif;font-size:16px;font-style:italic}
.hdr-sub{font-size:9px;opacity:.65;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.hdr-actions{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.pac-banner{background:var(--navy);border-bottom:3px solid var(--blue);padding:10px 20px 14px;color:#fff}
.pac-nombre{font-family:'Playfair Display',serif;font-size:18px;font-weight:700}
.pac-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px;font-size:11px;opacity:.8}
.page{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.sec-title span{font-size:15px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-green{background:#dcfce7;color:#166534}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#b91c1c}
.field-row{display:flex;gap:10px;margin-bottom:8px;font-size:12px}
.field-lbl{font-weight:600;color:var(--muted);min-width:110px;flex-shrink:0}
.field-val{color:#1e293b;flex:1}
/* Farmacia selector */
.farm-selector{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.farm-card{flex:1;min-width:200px;border:2px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .2s}
.farm-card.active{border-color:var(--blue);background:#eff6ff}
.farm-card h4{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--navy)}
.farm-card p{font-size:11px;color:var(--muted);margin:2px 0;line-height:1.4}
.farm-detail{background:#f8fafc;border-radius:8px;padding:12px;margin-top:8px;display:none}
.farm-detail.show{display:block}
/* Btn genérico */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;text-decoration:none;transition:all .15s}
.btn-wa{background:#25D366;color:#fff}
.btn-wa:hover{background:#128C7E}
.btn-mail{background:#2563eb;color:#fff}
.btn-mail:hover{background:#1d4ed8}
.btn-turno{background:var(--navy);color:#fff}
.btn-turno:hover{background:#1e3a5f}
.btn-consulta{background:var(--purple);color:#fff;width:100%}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
/* Ejercicios */
.ej-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.ej-n{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:4px}
.ej-d{font-size:12px;color:#475569;line-height:1.5;margin-bottom:6px}
.ej-series{font-size:11px;background:#f1f5f9;border-radius:6px;padding:3px 8px;display:inline-block;margin-right:4px;color:#334155}
.ej-resumen{font-size:11px;color:#64748b;background:#f8fafc;border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 6px 6px 0;margin-top:6px}
.ej-video-btn{background:#fee2e2;color:#b91c1c;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
/* Evaluación */
.eval-entry{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.eval-entry.friday{border-color:var(--amber);background:#fffbeb}
.pain-scale{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
.pain-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:#f8fafc;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pain-btn.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:6px 0}
.chk-item{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);cursor:pointer;user-select:none;background:#f8fafc;transition:all .15s}
.chk-item.sel{background:#fee2e2;border-color:#fca5a5;color:#b91c1c;font-weight:600}
.resumen-semanal{background:#fffbeb;border:2px solid var(--amber);border-radius:10px;padding:14px;text-align:center}
/* Directorio */
.dir-card{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.dir-ico{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:#f1f5f9}
.dir-info{flex:1;min-width:0}
.dir-name{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:2px}
.dir-det{font-size:11px;color:var(--muted);line-height:1.6}
.dir-btns{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
/* Calistenia */
.fase-line{display:flex;align-items:center;gap:10px;margin:8px 0}
.fase-ico{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.fase-info{flex:1;font-size:12px;line-height:1.5}
/* Consultas online */
.consulta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.consulta-card{border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.consulta-precio{font-size:20px;font-weight:700;color:var(--navy);margin:6px 0}
.consulta-tipo{font-size:12px;font-weight:600;color:#334155;margin-bottom:4px}
.consulta-det{font-size:11px;color:var(--muted);margin-bottom:10px}
/* Tags centro */
.centro-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;background:rgba(30,79,163,.12);color:var(--navy);margin-left:8px}
/* Print */
@media print{
  .header{position:relative;background:#0b1f3a!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .hdr-actions,.btn,.eval-entry{display:none}
  .eval-entry.show-print{display:block}
  .farm-detail{display:block!important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
.loading{text-align:center;color:var(--muted);padding:40px;font-size:13px}
.viernes-banner{background:#fef3c7;border:2px solid var(--amber);border-radius:10px;padding:14px;margin-bottom:14px;text-align:center}

.rmyt-title{text-align:center;font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--navy);letter-spacing:.06em;margin:4px 0 2px}
.rmyt-title small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
/* Bandas F1-F4 (mismo orden que el RMYT de OCM) */
.fband{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:10px;padding:9px 14px;margin:18px 0 10px;font-size:13px;font-weight:700;letter-spacing:.02em;break-after:avoid}
.fband .fnum{background:#fff;color:var(--navy);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:800}
.fband .fico{font-size:16px}
.med-item{border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;margin-bottom:8px;break-inside:avoid;background:#fff}
.med-n{font-size:13px;font-weight:700;color:#0f172a}
.med-num{background:#dbeafe;color:#1e40af;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700;margin-right:4px}
.med-l{font-size:11.5px;color:#475569;margin-top:3px}
.med-adv{font-size:11.5px;color:#92400e;background:#fef3c7;border-radius:6px;padding:4px 8px;margin-top:5px}
.imd-disc{font-size:11px;color:#92400e;background:#fffbeb;border-left:3px solid var(--amber);border-radius:0 6px 6px 0;padding:8px 10px;margin-top:10px}
.fgroup{break-inside:avoid;page-break-inside:avoid}
.pac-banner .centro-tag{background:rgba(255,255,255,.18);color:#fff}
.pdf-mode .btn-consulta{display:none}
.only-pdf{display:none}
.pdf-mode .no-pdf{display:none!important}
.pdf-mode .only-pdf{display:block}
.pdf-mode .header{position:static}
.pdf-mode .hdr-actions{display:none}
.pdf-mode .ej-video-btn{display:none}
.pdf-mode .card,.pdf-mode .med-item,.pdf-mode .ej-card,.pdf-mode .dir-card{break-inside:avoid;box-shadow:none}
@media print{.no-pdf{display:none!important}.only-pdf{display:block!important}.ej-video-btn{display:none}.fband{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>

function psNorm_(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function psSugerir_(){
  const dx = psNorm_((DATOS.consulta||{}).dx || '');
  if(!dx) return '';
  let mejor = '', largo = 0;
  Object.keys(PS_PALABRAS).forEach(slug=>{
    PS_PALABRAS[slug].forEach(w=>{ if(dx.indexOf(w)>-1 && w.length>largo && PS_TEMAS.some(t=>t.slug===slug)){ mejor = slug; largo = w.length; } });

  return mejor;
}

  return r.json();
}
async function psPost_(cuerpo){

function psRefrescarClaves_(){
  const sel = document.getElementById('ps-tema'); if(!sel) return;
  const cl = sel.options[sel.selectedIndex].getAttribute('data-claves')||'';
  const box = document.getElementById('ps-claves');
  if(box) box.innerHTML = cl.indexOf('A')>-1
    ? '✅ Se emite: '+PS_CLAVES_TXT.A
    : '<span style="color:#92400e">Este tema todavía no tiene Clave A publicada: se conecta el artículo general y, cuando se publique la A, volvé a emitirla.</span>';
}
function psMsg_(t,err){ const m = document.getElementById('ps-msg'); if(m){ m.style.color = err?'#b91c1c':'#166534'; m.textContent = t; } }
async function psCrear_(){
  if(PS_OCUPADO) return; const sel = document.getElementById('ps-tema'); if(!sel) return;
  const cl = sel.options[sel.selectedIndex].getAttribute('data-claves')||'';
  PS_OCUPADO = true; psMsg_('Conectando…');
  try{
    const r = await psPost_({action:'ps_crear_acceso', dni:psDni_(), tema:sel.value, dias:document.getElementById('ps-dias').value, claves:'A', vincular:cl.indexOf('A')<0});
    if(!r.success){ psMsg_(r.error||'No se pudo generar el código',true); }
    else { const a = await psGet_('get_pagina_salud_accesos','&dni='+encodeURIComponent(psDni_())); PS_ACCESOS = (a&&a.accesos)||[]; renderPage(); psMsg_(r.message||'Listo'); }
  }catch(e){ psMsg_('No se pudo conectar. Reintentá.',true); }
  PS_OCUPADO = false;
}
async function psExtender_(codigo){
  try{ const r = await psPost_({action:'ps_extender_acceso', codigo:codigo, dias:30}); if(!r.success) alert(r.error||'No se pudo extender'); await cargarPS_(); }catch(_){ alert('No se pudo conectar.'); }
}
async function psRenovar_(){
  try{ const r = await psPost_({action:'ps_renovar_paciente', dni:psDni_(), dias:30, profesional:'Dr. Luis Alberto Muratori'}); psMsgA_(r.success ? (r.message||'Códigos renovados') : (r.error||'No se pudo renovar'), !r.success); if(r.success) await cargarPS_(); }catch(_){ psMsgA_('No se pudo conectar.',true); }
}
function psMsgA_(t,err){ const m = document.getElementById('psa-msg'); if(m){ m.style.color = err?'#b91c1c':'#166534'; m.textContent = t; } else if(err) alert(t); }
async function psAlta_(){
  const tipo = document.getElementById('psa-tipo').value;
  if(!confirm('¿Dar el ALTA '+(tipo==='quirurgica'?'quirúrgica':'médica')+' a este paciente? Se envía la bitácora por mail y se da de baja su código de la página de salud.')) return;
  try{
    const r = await psPost_({action:'alta_paciente', dni:psDni_(), tipo:tipo, resumen:document.getElementById('psa-resumen').value, conclusion:document.getElementById('psa-concl').value, profesional:'Dr. Luis Alberto Muratori'});

}

// ── F1: MEDICACIÓN (lo realmente indicado en OCM) ────────────────
function renderMedicacion(){
  const m = DATOS.medicacion || {};
  let html = '<div class="card"><div class="sec-title"><span>💊</span> Medicación indicada</div>';
  let hay = false;

  const items = m.items || [];
  if(items.length){
    hay = true;
    html += items.map((it,i)=>{
      const l1 = [it.presentacion, it.concentracion, it.via].filter(Boolean).map(esc).join(' · ');
      const l2 = [it.frecuencia?'Frecuencia: '+esc(it.frecuencia):'', it.dias?'Durante: '+esc(it.dias)+' días':''].filter(Boolean).join(' · ');
      return '<div class="med-item">'+
        '<div class="med-n"><span class="med-num">Rx '+(i+1)+'</span> '+esc(it.nombre)+'</div>'+
        (l1?'<div class="med-l">'+l1+'</div>':'')+
        (l2?'<div class="med-l"><strong>'+l2+'</strong></div>':'')+
        (it.funcion?'<div class="med-l">Para qué: '+esc(it.funcion)+'</div>':'')+
        (it.indicacion?'<div class="med-adv">⚠️ '+esc(it.indicacion)+'</div>':'')+
      '</div>';
    }).join('');
  }

  if(m.magistral_explicacion){
    hay = true;
    html += '<div class="med-item" style="border-left-color:var(--purple)">'+
      '<div class="med-n">⚗️ Prescripción magistral</div>'+
      '<div class="med-l" style="color:#1e293b;font-size:12px;line-height:1.6">'+nl2br(m.magistral_explicacion)+'</div>'+
    '</div>';
    const nombres = (m.farmacias_magistrales||[]).map(String);
    const claves = Object.keys(FARMACIAS).filter(k=>nombres.some(n=>n.toLowerCase().indexOf(FARMACIAS[k].nombre.toLowerCase().replace('farmacia ',''))>-1));
    if(claves.length){
      html += '<div style="margin-top:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px">Dónde retirarla</div>';
      claves.forEach(k=>{
        const f = FARMACIAS[k];
        html += '<div class="dir-card"><div class="dir-ico">⚗️</div><div class="dir-info"><div class="dir-name">'+f.nombre+'</div>'+
          '<div class="dir-det">📍 '+f.dir+'<br>📞 '+f.tel+'</div></div>'+
          '<div class="dir-btns no-pdf"><a class="btn btn-mail" style="font-size:11px" href="mailto:'+f.mail+'?subject='+encodeURIComponent('Receta Magistral — Dr. Muratori')+'&body='+encodeURIComponent('Estimados, receta magistral del Dr. Luis Alberto Muratori. DNI del paciente: '+(DATOS.paciente&&DATOS.paciente.dni||''))+'" target="_blank">📧 Email farmacia</a></div></div>';
      });
    }
  }

  // Compatibilidad con documentos generados antes de la unificación
  const legacy = [].concat(m.farmacopeo||[], m.magistral||[]).filter(x=>x&&x.principio_activo);
  if(legacy.length && !items.length){
    hay = true;
    html += legacy.map(x=>'<div class="med-item"><div class="med-n">'+esc(x.principio_activo)+(x.dosis_mg?' '+esc(x.dosis_mg)+' mg':'')+'</div>'+
      '<div class="med-l">'+[x.presentacion, x.frecuencia?'cada '+esc(x.frecuencia):'', x.dosis_terapeutica].filter(Boolean).map(esc).join(' · ')+'</div></div>').join('');
  }

  if(!hay) html += '<div style="font-size:12px;color:var(--muted)">No se indicó medicación en esta consulta.</div>';
  html += '</div>';
  return html;
}

// ── Solicitud de consulta — formulario en el mismo documento ──────
let TIPO_CONSULTA_ACTIVO = '';
function solicitarConsulta(tipo){
  const tar = DATOS.tarifas || {};
  const t = tar[tipo] || {label:tipo, precio:null};
  TIPO_CONSULTA_ACTIVO = tipo;
  const lbl = document.getElementById('modal-tipo-lbl');
  if(lbl) lbl.textContent = `${{texto:'✍️',video:'📹',virtual:'🩺'}[tipo]} ${t.label}${t.precio?' — $'+Number(t.precio).toLocaleString('es-AR'):''}`;
  const m = document.getElementById('modal-solicitar');
  if(m) m.style.display='block';
  document.getElementById('inp-pregunta')?.focus();
  m?.scrollIntoView({behavior:'smooth',block:'center'});
}

async function enviarSolicitudConsulta(){
  const pregunta = document.getElementById('inp-pregunta')?.value.trim();
  if(!pregunta){ alert('Por favor escribí tu consulta antes de enviar.'); return; }
  const pac = DATOS.paciente || {};
  const tar = (DATOS.tarifas||{})[TIPO_CONSULTA_ACTIVO] || {};
  try{
    await fetch(SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveConsulta',
        dni:pac.dni||DNI, paciente:(pac.apellido||'')+', '+(pac.nombre||''),
        tipo:TIPO_CONSULTA_ACTIVO, precio:tar.precio||0, pregunta})});
  }catch(_){}
  const nombre = (pac.apellido||'')+', '+(pac.nombre||'');
  const precio = tar.precio?`$${Number(tar.precio).toLocaleString('es-AR')}`:'a convenir';
  const texto = `Hola Dr. Muratori, quiero solicitar una ${tar.label||TIPO_CONSULTA_ACTIVO} (${precio}).\n\nMi consulta:\n"${pregunta}"\n\nSoy ${nombre}. DNI: ${pac.dni||DNI||'—'}.`;
  window.open(`mailto:${DOCTOR_MAIL}?subject=${encodeURIComponent('Solicitud de consulta — '+(tar.label||TIPO_CONSULTA_ACTIVO))}&body=${encodeURIComponent(texto)}`,'_blank');
  const m = document.getElementById('modal-solicitar');
  if(m) m.innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:24px;margin-bottom:8px">✅</div><div style="font-size:13px;font-weight:600;color:#166534;margin-bottom:6px">¡Solicitud enviada!</div><div style="font-size:12px;color:#475569;line-height:1.6">El Dr. Muratori recibió su consulta por mail.<br>Le enviará el link de pago a la brevedad.<br>Una vez confirmado el pago, recibirá su respuesta.</div></div>`;
}

// ── ENVÍO POR MAIL (PDF del documento completo) ──────────────────
// Genera el PDF del documento TAL CUAL se ve (F1→F4). Lo usa el botón de
// esta página y también OCM ("Concluir y enviar") a través de un iframe.
async function generarPDFBase64(){
  if(typeof html2pdf === 'undefined') throw new Error('La librería de PDF todavía no cargó (conexión lenta)');
  const p = DATOS.paciente || {};
  const nombreArchivo = 'RMYT_'+(p.apellido||'paciente').replace(/[^a-zA-Z0-9]/g,'_')+'_'+new Date().toLocaleDateString('es-AR').replace(/\//g,'-')+'.pdf';
  document.body.classList.add('pdf-mode');
  try{
    const blob = await html2pdf().set({
      margin: 6,
      filename: nombreArchivo,
      image:{type:'jpeg', quality:0.85},
      html2canvas:{scale:1.6, useCORS:true, backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
      pagebreak:{mode:['css','avoid-all']}
    }).from(document.getElementById('doc-root')).outputPdf('blob');
    return { base64: await blobToBase64(blob), nombre: nombreArchivo };
  } finally {
    document.body.classList.remove('pdf-mode');
  }
}

async function enviarPDFAlPaciente(){
  const p = DATOS.paciente || {};
  if(!p.mail){
    alert('⚠️ Este paciente no tiene un email cargado en el sistema.\n\nCargalo en OCM (ficha del paciente) para poder enviarle el PDF por mail.');
    return;
  }
  const btn = document.getElementById('btn-enviar-mail');
  const textoOriginal = btn ? btn.innerHTML : '';
  if(btn){ btn.innerHTML='⏳ Generando PDF...'; btn.style.pointerEvents='none'; btn.style.opacity='.7'; }
  try{
    const pdf = await generarPDFBase64();
    if(btn) btn.innerHTML='📤 Enviando...';
    const nombreCompleto = (p.apellido||'')+(p.nombre?', '+p.nombre:'');
    let tk=''; try{ tk=localStorage.getItem('ocm_app_token')||''; }catch(_){}
    const r = await fetch(SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action:'enviarRecetaPorMail',
        Email: p.mail,
        Nombre_Paciente: nombreCompleto,
        Asunto: 'RMYT — Recomendaciones Médicas y Terapéuticas — Dr. Muratori',
        Mini_Resumen: 'Adjunto encontrará su RMYT: medicación, resumen de la consulta y estudios, plan de kinesiología y ejercicios, y evaluación semanal.\n\nComplete su evaluación semanal en: '+linkAutoeval()+psTextoMail_(),
        Pdf_Base64: pdf.base64,
        Pdf_Nombre: pdf.nombre,
        token: tk
      }),
      signal: AbortSignal.timeout(30000)
    });
    const data = await r.json();
    if(!data.success) throw new Error(data.error || 'Error desconocido del servidor');
    if(btn){ btn.innerHTML='✅ Enviado'; setTimeout(()=>{ btn.innerHTML=textoOriginal; btn.style.pointerEvents=''; btn.style.opacity=''; },2500); }
    alert('✅ El documento fue enviado por mail a '+p.mail);
  }catch(err){
    if(btn){ btn.innerHTML=textoOriginal; btn.style.pointerEvents=''; btn.style.opacity=''; }
    alert('❌ No se pudo enviar el mail.\n\n'+(err && err.message ? err.message : err)+'\n\nRevise la conexión a internet e intente de nuevo.');
  }
}

function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onloadend = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
